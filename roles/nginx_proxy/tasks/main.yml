---
- name: Install Nginx and httpd-tools (for htpasswd)
  ansible.builtin.dnf:
    name:
      - nginx
      - httpd-tools
    state: present

- name: Create SSL directory
  ansible.builtin.file:
    path: /etc/nginx/ssl
    state: directory
    mode: '0700'

- name: Generate self-signed SSL certificate
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout {{ nginx_proxy_ssl_key }}
    -out {{ nginx_proxy_ssl_cert }}
    -subj "/C=US/ST=State/L=City/O=Org/OU=IT/CN={{ nginx_proxy_domain }}"
  args:
    creates: "{{ nginx_proxy_ssl_cert }}"

- name: Generate htpasswd file for basic auth
  ansible.builtin.command: >
    htpasswd -bc {{ nginx_proxy_htpasswd }}
    {{ nginx_proxy_basic_auth_user }} {{ nginx_proxy_basic_auth_pass }}
  args:
    creates: "{{ nginx_proxy_htpasswd }}"

- name: Deploy Nginx reverse proxy configuration
  ansible.builtin.template:
    src: default.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    mode: '0644'

- name: Start and enable Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
