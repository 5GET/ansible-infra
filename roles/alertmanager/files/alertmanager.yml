---
global:
  resolve_timeout: 5m
  telegram_api_url: "https://api.telegram.org/bot{{ telegram_bot_token }}"

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram'

receivers:
  - name: 'telegram'
    telegram_configs:
      - chat_id: {{ telegram_chat_id }}
        send_resolved: true
        parse_mode: "HTML"
