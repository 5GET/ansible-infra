---
groups:
  - name: infrastructure_alerts
    interval: 30s
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Server is down: {{ $labels.instance }}"
          description: "Server {{ $labels.instance }} is unreachable for more than 1 minute"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage: {{ $labels.instance }}"
          description: "CPU usage {{ $value | printf \"%.1f\" }}% on server {{ $labels.instance }}"

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space: {{ $labels.instance }}"
          description: "Disk usage {{ $value | printf \"%.1f\" }}% on {{ $labels.mountpoint }}"

      - alert: ContainerDown
        expr: count(container_last_seen) by (name) < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container is down: {{ $labels.name }}"
          description: "Container {{ $labels.name }} is not sending metrics"
