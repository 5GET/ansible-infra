---
groups:
  - name: infrastructure_alerts
    interval: 30s
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: " Сервер упал: {{ $labels.instance }}"
          description: "Сервер {{ $labels.instance }} не доступен более 1 минуты"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "️ Высокая загрузка CPU: {{ $labels.instance }}"
          description: "Загрузка CPU {{ $value | printf \"%.1f\" }}% на сервере {{ $labels.instance }}"

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: " Мало места на диске: {{ $labels.instance }}"
          description: "Использование диска {{ $value | printf \"%.1f\" }}% на {{ $labels.mountpoint }}"

      - alert: ContainerDown
        expr: count(container_last_seen) by (name) < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "🐳 Контейнер упал: {{ $labels.name }}"
          description: "Контейнер {{ $labels.name }} не отправляет метрики"
