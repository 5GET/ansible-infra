---
- name: Create host data directory
  ansible.builtin.file:
    path: "{{ host_data_dir }}"
    state: directory
    mode: '0755'

- name: Deploy custom index.html from Jinja2 template
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ host_data_dir }}/index.html"
    mode: '0644'

- name: Run Nginx container with mounted volume
  community.docker.docker_container:
    name: my-nginx
    image: "{{ nginx_image }}"
    state: started
    restart_policy: always
    ports:
      - "{{ nginx_port }}:80"
    volumes:
      - "{{ host_data_dir }}:/usr/share/nginx/html:ro"
