---
- name: Install dnf-utils
  ansible.builtin.dnf:
    name: dnf-utils
    state: present

- name: Add official Docker repository
  ansible.builtin.command: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo

- name: Install base Docker packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present

- name: Start and enable Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Install python3-pip
  ansible.builtin.dnf:
    name: python3-pip
    state: present

- name: Install Python docker library via pip
  ansible.builtin.pip:
    name: docker
    executable: pip3
    state: present
