---
# Web server variables
app_name: "My Ansible App"
nginx_port: 8080
nginx_image: "nginx:latest"
host_data_dir: "/opt/nginx-data"
custom_message: "Hello! This server is configured with Ansible. Host: {{ inventory_hostname }}"

# Monitoring
prometheus_port: 9091
node_exporter_port: 9100
cadvisor_port: 8081

# Grafana
grafana_port: 3000
grafana_admin_password: "admin123"

# Alertmanager
alertmanager_port: 9093
# Nginx Reverse Proxy
nginx_proxy_domain: "monitoring.local"
nginx_proxy_ssl_cert: "/etc/nginx/ssl/server.crt"
nginx_proxy_ssl_key: "/etc/nginx/ssl/server.key"
nginx_proxy_htpasswd: "/etc/nginx/.htpasswd"
