---
# Переменные для веб-серверов
app_name: "My Ansible App"
nginx_port: 8080
nginx_image: "nginx:latest"
host_data_dir: "/opt/nginx-data"
custom_message: "Привет! Этот сервер настроен с помощью Ansible. Хост: {{ inventory_hostname }}"
# Мониторинг
prometheus_port: 9091
node_exporter_port: 9100
cadvisor_port: 8081
# Grafana
grafana_port: 3000
grafana_admin_password: "admin123" # В реальном проекте использовать Ansible Vault
# Alertmanager
alertmanager_port: 9093
