---
- name: Установка Docker и развертывание Nginx с шаблоном
  hosts: webservers
  become: yes
  tasks:
    - name: Установка утилиты dnf-utils
      dnf:
        name: dnf-utils
        state: present

    - name: Добавление официального репозитория Docker
      command: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Установка базовых пакетов Docker
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Запуск и добавление Docker в автозагрузку
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Установка python3-pip
      dnf:
        name: python3-pip
        state: present

    - name: Установка Python-библиотеки docker для Ansible через pip
      pip:
        name: docker
        executable: pip3
        state: present

    - name: Создание директории для данных на хосте
      file:
        path: "{{ host_data_dir }}"
        state: directory
        mode: '0755'

    - name: Развертывание кастомной страницы index.html из шаблона Jinja2
      template:
        src: templates/index.html.j2
        dest: "{{ host_data_dir }}/index.html"
        mode: '0644'

    - name: Запуск контейнера Nginx с подключенным томом (Volume)
      docker_container:
        name: my-nginx
        image: "{{ nginx_image }}"
        state: started
        restart_policy: always
        ports:
          - "{{ nginx_port }}:80"
        volumes:
          - "{{ host_data_dir }}:/usr/share/nginx/html:ro"
