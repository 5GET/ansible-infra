---
- name: Install exporters on all hosts
  hosts: webservers
  become: true
  roles:
    - role: exporters
      tags: [exporters, monitoring]

- name: Install monitoring stack (Prometheus + Grafana + Alertmanager)
  hosts: monitoring
  become: true
  roles:
    - role: prometheus
      tags: [prometheus, monitoring]
    - role: grafana
      tags: [grafana, monitoring]
    - role: alertmanager
      tags: [alertmanager, monitoring]
